name: Monitoreo Granizo SMN

on:
  schedule:
    # Se ejecuta cada 5 minutos
    - cron: '*/5 * * * *'
  # Permite ejecutarlo a mano desde la interfaz para probar
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          pip install requests shapely

      - name: Ejecutar script de alerta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python alerta_granizo.py

      - name: Guardar historial de alertas enviadas
        run: |
          git config --global user.name "bot-clima"
          git config --global user.email "bot@clima.local"
          git add registro_alertas.json || true
          git commit -m "Actualizar cooldown de alertas [skip ci]" || true
          git push || true
